{% extends '../dashboard.html' %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-end m-3">
        <a href="#" class="btn  btn-sm btn-primary">
            Add Account
        </a>
    </div>
    
    <div class="card p-3">
        <div class="card-body px-0 pb-2">
            <div class="table-responsive">
                <table class="table align-items-center mb-0">
                    <thead>
                        <tr>
                            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                                Account</th>
                            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2 text-center">
                                Owner</th>
                            <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                                Balance</th>
                            <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                                Created</th>
                            <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                                Status</th>
                            <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                                Actions</th>
                        </tr>
                    </thead>

                    {% for acc in accounts %}
                    <tr>
                        <td class="align-middle text-sm ">
                            <span class="text-xs font-weight-bold"> {{acc.account_no}} </span>
                        </td>
                        <td class="align-middle text-center text-sm">
                            <span class="text-xs font-weight-bold"> 
                                <a href="">{{acc.user.email}} </a>
                            </span>
                        </td>
                        <td class="align-middle text-center text-sm">
                            <span class="text-xs font-weight-bold"> $ {{acc.balance}} </span>
                        </td> <td class="align-middle text-center text-sm">
                            <span class="text-xs font-weight-bold"> {{acc.user.date_joined | timesince }} </span>
                        </td> 
                        <td class="align-middle text-center text-sm">
                            <span class="text-xs font-weight-bold"> {{acc.status}} </span>
                        </td>
                        <td class="align-middle text-center text-sm">
                            <a href="" class="btn btn-sm mt-3 btn-outline-primary">Monitor</a>
                            <a href="{% url 'update_account' acc.id%}" class="btn btn-sm mt-3 btn-outline-info">Manage</a>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
